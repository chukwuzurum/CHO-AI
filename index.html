<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI Search</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #111827;
      --text: #e5e7eb;
      --muted: #9ca3af;
      --accent: #22d3ee;
      --accent-2: #a78bfa;
      --border: #1f2937;
      --good: #10b981;
      --warn: #f59e0b;
      --error: #ef4444;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: radial-gradient(1200px 600px at 20% 10%, #0b1220 0%, #0f172a 40%, #0a0f1d 100%);
      color: var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, "Helvetica Neue", Arial, "Noto Sans", "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol";
      min-height: 100vh; 
      display: grid;
      grid-template-rows: auto 1fr auto;
    }

    header {
      padding: 24px 16px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 700;
      letter-spacing: 0.3px;
    }

    .logo-badge {
      width: 36px;
      height: 36px;
      border-radius: 9px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      display: grid;
      place-items: center;
      color: #0b1020;
      font-weight: 800;
    }

    main {
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
      padding: 16px;
    }

    .panel {
      background: rgba(17, 24, 39, 0.7);
      backdrop-filter: blur(6px);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 20px 50px rgba(0,0,0,0.35);
    }

    .search-bar {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      padding: 16px;
      border-bottom: 1px solid var(--border);
    }

    .input-wrap {
      position: relative;
    }

    input[type="text"] {
      width: 100%;
      padding: 14px 44px 14px 14px;
      background: #0b1220;
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 12px;
      outline: none;
      font-size: 16px;
      transition: border-color 160ms ease, box-shadow 160ms ease;
    }

    input[type="text"]:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 4px rgba(34, 211, 238, 0.15);
    }

    .kbd {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
      font-size: 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 2px 6px;
      background: #0a101c;
    }

    button {
      padding: 12px 16px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: linear-gradient(135deg, #0b1220, #101826);
      color: var(--text);
      cursor: pointer;
      font-weight: 600;
      transition: transform 120ms ease, box-shadow 160ms ease, border-color 160ms ease;
    }

    button:hover {
      border-color: var(--accent);
      box-shadow: 0 8px 24px rgba(34, 211, 238, 0.15);
      transform: translateY(-1px);
    }

    .subbar {
      display: flex;
      gap: 8px;
      align-items: center;
      padding: 12px 16px; 
      border-bottom: 1px solid var(--border);
      font-size: 14px;
      color: var(--muted);
    }

    .chip {
      border: 1px solid var(--border);
      padding: 6px 10px;
      border-radius: 999px;
      cursor: pointer;
      background: #0b1220;
      transition: border-color 160ms ease, color 160ms ease;
      user-select: none;
    }
r
    .chip:hover { border-color: var(--accent); color: var(--text); }

    .results {
      padding: 16px;
    }

    .result-card {
      background: #0b1220;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 12px;
    }

    .result-title {
      font-weight: 700;
      margin-bottom: 6px;
    }

    .result-meta {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 10px;
    }

    .result-body {
      line-height: 1.6;
      color: #e6edf5;
    }

    .loading {
      display: none;
      align-items: center;
      gap: 10px;
      padding: 12px 16px;
      color: var(--muted);
    }

    .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid rgba(34, 211, 238, 0.2);
      border-top-color: var(--accent); 
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    footer {
      padding: 20px 16px;
      text-align: center;
      color: var(--muted);
      font-size: 13px;
    }


    @media (max-width: 640px) {
      .search-bar { grid-template-columns: 1fr; }
      
      .kbd { display: none; }
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">
      <div class="logo-badge">CAI</div>
      <div>Search</div>
    </div>
  </header>

  <main>
    <section class="panel" aria-label="AI search panel">
      <div class="search-bar">
        <div class="input-wrap">
          <input id="query" type="text" placeholder="Ask anything…"
                 aria-label="Search query" autocomplete="off" />
          <div class="kbd">Enter</div>
        </div>
        <button id="searchBtn" aria-label="Run search">Search</button>
      </div>

      <div class="subbar">
        <span>Try:</span>
        <div class="chip" data-example="How does photosynthesis work?">Photosynthesis</div>
        <div class="chip" data-example="What is the Nigerian tech ecosystem like?">Nigeria tech</div>
        <div class="chip" data-example="Summarize the history of Lagos.">Lagos history</div>
        <div class="chip" data-example="breakdown of the formation of the nigerian constitution resulting in the 1999 Code of Conduct of the Nigerian constitution.">Nigerian constitution</div>
      </div>

      <div class="loading" id="loading">
        <div class="spinner" aria-hidden="true"></div>
        <span>please wait a moment ... </span>
      </div>

      <div id="results" class="results" role="region" aria-live="polite" aria-busy="false"></div>
    </section>
  </main>

  <footer>
    Built with HTML, CSS, and JavaScript. By Alagwu Chukwuzurum Williams.
  </footer>

  <script>
    const queryInput = document.getElementById('query');
    const searchBtn = document.getElementById('searchBtn');
    const resultsEl = document.getElementById('results');
    const loadingEl = document.getElementById('loading');

    // Simulated AI response (replace with your backend call)
    async function mockAiSearch(prompt) {
      // Simulate latency
      await new Promise(res => setTimeout(res, 900));

      // Lightweight prompt-aware response
      const now = new Date().toLocaleString();
      return {
        title: 'AI Answer',
        meta: `Generated • ${now}`,
        content: [
          `You asked: "${prompt}"`,
          `Here’s a concise, structured answer crafted by CHO AI.`,
          `To use a real model, connect an API endpoint and stream tokens for better UX.`,
        ],
        suggestions: [
          'Ask for examples or code snippets',
          'Request a summary vs. deep dive',
          'Follow up with “cite sources”'
        ]
      };
    }

    // Render a single result card' 
    function renderResultCard(result) {
      const card = document.createElement('div');
      card.className = 'result-card';


      const title = document.createElement('div');
      title.className = 'result-title';
      title.textContent = result.title;

      const meta = document.createElement('div');
      meta.className = 'result-meta';
      meta.textContent = result.meta;

      const body = document.createElement('div');
      body.className = 'result-body';
      body.innerHTML = result.content
        .map(p => `<p>${escapeHtml(p)}</p>`)
        .join('');

      const tips = document.createElement('div');
      tips.className = 'result-meta';
      tips.textContent = `Tips: ${result.suggestions.join(' • ')}`;

      card.appendChild(title);
      card.appendChild(meta);
      card.appendChild(body);
      card.appendChild(tips);

      return card;
    }

    // Escape HTML to avoid injection
    function escapeHtml(str) {
      return str
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    // Main search flow
    async function runSearch() {
    resultsEl.innerHTML = '';

      try {
        const response = await fetch(`https://api.example.com/search?q=${encodeURIComponent(q)}`);
        const data = await response.json();
        data.results.forEach(item => {
          const card = renderResultCard(item);
          resultsEl.appendChild(card);
        });
      } catch (err) {
        console.error(err);
      }
    }

    // Events
    searchBtn.addEventListener('click', runSearch);
    queryInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') runSearch();
    });

    // Example chips
    document.querySelectorAll('.chip').forEach(chip => {
      chip.addEventListener('click', () => {
        const example = chip.getAttribute('data-example');
        queryInput.value = example;
        runSearch();
      });
    });
  </script>
</body>
</html>
